
name: Build By LainProject EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --onefile --windowed --name ByLainProject ByLainProject_scanner.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ByLainProject-Windows
          path: dist/ByLainProject.exe
